[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes (안 쓰는 import/변수, 정의 안 된 이름)
  "I",        # import 정렬
  "B",        # bugbear (가변 기본인자 같은 버그 패턴)
  "UP",       # 최신 문법으로 업그레이드
  "SIM",      # 불필요하게 복잡한 코드
  "N",        # 네이밍
  "NPY",      # numpy 구식 API
]
ignore = [
  "N812",     # import torch.nn.functional as F 허용
  "N806",     # 함수 안의 대문자 변수(Q, V, A 등 수식 표기) 허용
]

[tool.ruff.format]
quote-style = "double"
[tool.ruff.lint.isort]
known-third-party = ["wandb"]  # 루트의 wandb/ 로그 폴더를 로컬 패키지로 오인하지 않도록
