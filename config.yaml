# make_env 가 읽는 키 (필수)
opponents: [bronze, bronze, bronze, silver, silver, gold, diamond]  # 봇 이름 또는 에이전트 파일 (.py)
num_envs: 64        # 배치 B
max_steps: 1000     # 에피소드 길이 상한 (null = 무한)
seed: 0

# 나머지는 자유. 코드에서 cfg.<키> 로 읽음
total_samples: 5_000_000
frame_stack: 4
lr: 3.0e-4
gamma: 0.99
batch_size: 256
